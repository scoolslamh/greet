
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الأمن والحراسة المدرسية</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f6fa;
      color: #17324d;
    }

    .header {
      background: #123b5d;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    .header p {
      margin: 0;
      color: #d9e6f1;
      font-size: 14px;
    }

    .container {
      max-width: 460px;
      margin: 70px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }

    .card h2 {
      margin: 0 0 12px;
      text-align: center;
    }

    .description {
      color: #657587;
      text-align: center;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 17px;
      outline: none;
      direction: ltr;
      text-align: center;
    }

    input:focus {
      border-color: #1677b8;
      box-shadow: 0 0 0 3px rgba(22,119,184,.12);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: #1479b8;
      color: white;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #0d6094;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.8;
      font-size: 14px;
      background: #e8f2fc;
      color: #145d90;
    }

    .message.error {
      background: #fff0f0;
      color: #a12626;
    }

    .message[hidden] {
      display: none;
    }

    .note {
      margin-top: 22px;
      text-align: center;
      color: #78889a;
      font-size: 12px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      .container { margin: 35px auto; }
      .card { padding: 24px 20px; }
      .header h1 { font-size: 21px; }
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>نظام الأمن والحراسة المدرسية</h1>
    <p>إدارة بيانات الحراس ومتابعة التغطية الأمنية للمدارس</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>بوابة المدارس</h2>

      <p class="description">
        أدخل الرقم الوزاري للمدرسة للانتقال إلى بياناتها.
      </p>

      <form id="schoolForm">
        <label for="schoolNumber">الرقم الوزاري للمدرسة</label>

        <input
          id="schoolNumber"
          type="text"
          inputmode="numeric"
          pattern="[0-9]+"
          placeholder="أدخل الرقم الوزاري"
          autocomplete="off"
          required
        >

        <button id="submitButton" type="submit">
          متابعة
        </button>
      </form>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
        hidden
      ></div>

      <p class="note">
        تُعرض بيانات المدرسة الأساسية بعد التحقق من الرقم الوزاري.
        خدمات إدارة الحراس تتطلب صلاحية دخول معتمدة.
      </p>
    </section>
  </main>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbzL7ecfewM8Lqr1rSMabU3zS5KFXSXqFgH5WSXMWKvHdxJ4TmsavyvvSaJONV8RXBm0/exec';

    const form = document.getElementById('schoolForm');
    const input = document.getElementById('schoolNumber');
    const button = document.getElementById('submitButton');
    const message = document.getElementById('message');

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle('error', isError);
      message.hidden = false;
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      if (button.disabled) return;

      const schoolNumber = input.value.trim();

      if (!/^[0-9]+$/.test(schoolNumber)) {
        showMessage('يرجى إدخال رقم وزاري صحيح.', true);
        return;
      }

      button.disabled = true;
      input.readOnly = true;
      button.textContent = 'جارٍ التحقق...';
      showMessage('جارٍ التحقق من بيانات المدرسة، يرجى الانتظار...');

      try {
        const url = new URL(API_URL);
        url.searchParams.set('action', 'schoolLookup');
        url.searchParams.set('schoolNumber', schoolNumber);

        const response = await fetch(url.toString());

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();

        if (!data.success || !data.school) {
          showMessage(
            data.message || 'الرقم الوزاري غير مسجل في قاعدة البيانات.',
            true
          );
          return;
        }

        const destination = new URL(
          'school.html',
          window.location.href
        );

        destination.searchParams.set('schoolNumber', schoolNumber);

        window.location.href = destination.toString();

      } catch (error) {
        console.error('School lookup error:', error);

        showMessage(
          'تعذر الاتصال بقاعدة بيانات المدارس. يرجى المحاولة لاحقًا.',
          true
        );

      } finally {
        button.disabled = false;
        input.readOnly = false;
        button.textContent = 'متابعة';
      }
    });
  </script>
</body>
</html>
